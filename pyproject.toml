[project]
name = "site-mon"
version = "0.1.0"
description = "Website TLS certificate and HTTP availability monitor"
readme = "README.md"
authors = [
    { name = "cbinion", email = "134014495+cbinion@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "requests>=2.34.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
site-mon = "site_mon.cli:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
